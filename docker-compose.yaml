services:
  iris-init:
    image: alpine
    command: chown -R 51773:51773 /data
    volumes:
      - iris-data:/data

  iris:
    image: containers.intersystems.com/intersystems/irishealth-community:2026.1
    container_name: iris
    depends_on:
      iris-init:
        condition: service_completed_successfully
    ports:
      - "52773:52773"
      - "1972:1972"
    environment:
      - ISC_DATA_DIRECTORY=/data/iris
    volumes:
      - iris-data:/data:rw

volumes:
  iris-data:
