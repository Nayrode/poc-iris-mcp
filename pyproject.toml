[project]
name = "iris-mcp"
version = "0.1.0"
description = "Modular MCP server for viewing and editing InterSystems IRIS code via the Atelier REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
iris-mcp = "iris_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_mcp"]
